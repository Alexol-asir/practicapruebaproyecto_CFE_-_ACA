---
- name: Copiar el docker-compose del worker
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ carpeta_cluster }}/docker-compose.yml"
    owner: vagrant
    group: vagrant
    mode: "0644"

- name: Levantar el contenedor datanode
  community.docker.docker_compose_v2:
    project_src: "{{ carpeta_cluster }}"
    state: present