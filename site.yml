---
- name: Base común del clúster (las tres máquinas)
  hosts: bigdata
  become: true
  roles:
    - common

- name: Nodo master (NameNode)
  hosts: masters
  become: true
  roles:
    - master

- name: Configuración de los workers (DataNode)
  hosts: workers
  become: true
  roles:
    - worker

- name: Exportadores de métricas (las tres máquinas)
  hosts: bigdata
  become: true
  roles:
    - exportadores

- name: Monitorización (Prometheus, Grafana y Alertmanager en el master)
  hosts: masters
  become: true
  roles:
    - monitorizacion